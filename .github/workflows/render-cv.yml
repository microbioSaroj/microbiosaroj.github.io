name: Render a CV
on:
  push:
    branches:
      - main
      - master
    paths:
      - "_data/cv.yml"
      - "assets/rendercv/design.yaml"
      - "assets/rendercv/locale.yaml"
      - "assets/rendercv/settings.yaml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: Prepare RenderCV input
        run: |
          cv_file=$(find _data -maxdepth 1 -type f \( -name "cv.yaml" -o -name "cv.yml" \))
          if [ -z "$cv_file" ]; then
            echo "No cv.yml file found!"
            exit 1
          fi
          python3 - "$cv_file" << 'EOF'
          import yaml, sys
          with open(sys.argv[1], "r") as f:
              data = yaml.safe_load(f)
          # Load and merge locale file directly into cv data
          with open("assets/rendercv/locale.yaml", "r") as f:
              locale_data = yaml.safe_load(f)
          data.update(locale_data)
          # Load and merge design file directly into cv data
          with open("assets/rendercv/design.yaml", "r") as f:
              design_data = yaml.safe_load(f)
          data.update(design_data)
          cv = data.get("cv", {})
          label = cv.pop("label", None)
          image = cv.pop("image", None)
          summary = cv.pop("summary", None)
          address = cv.pop("address", {})
          if label:
              cv["headline"] = label
          if image:
              cv["photo"] = image
          if address:
              city = address.get("city", "")
              region = address.get("region", "")
              cv["location"] = f"{city}, {region}".strip(", ")
          if summary:
              sections = cv.get("sections", {})
              cv["sections"] = {"Summary": [summary], **sections}
          data["cv"] = cv
          # Map studyType to degree in Education entries
          sections = cv.get("sections", {})
          education = sections.get("Education", [])
          for entry in education:
              if isinstance(entry, dict) and "studyType" in entry:
                  entry["degree"] = entry.pop("studyType")
          # Convert all date fields to strings
          def sanitize_strings(obj):
              if isinstance(obj, dict):
                  for key, value in obj.items():
                      if key in ('start_date', 'end_date', 'date', 'releaseDate', 'score', 'courses') and isinstance(value, int):
                          obj[key] = str(value)
                      else:
                          sanitize_strings(value)
              elif isinstance(obj, list):
                  for item in obj:
                      sanitize_strings(item)
          sanitize_strings(data)
          with open("_data/cv_rendercv.yaml", "w") as f:
              yaml.dump(data, f, allow_unicode=True, sort_keys=False)
          EOF
      - name: RenderCV
        run: |
          rendercv_dir=$(find assets -maxdepth 1 -type d -name "rendercv")
          if [ -z "$rendercv_dir" ]; then
            echo "No RenderCV config directory found!"
            exit 1
          fi
          settings=$(find $rendercv_dir -maxdepth 1 -type f \( -name "settings.yaml" -o -name "settings.yml" \))
          if [ -z "$settings" ]; then
            echo "Missing RenderCV config file!"
            exit 1
          fi
          rendercv render _data/cv_rendercv.yaml --settings $settings
          rm assets/rendercv/rendercv_output/*.typ
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/rendercv/rendercv_output
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "Nothing to commit, skipping push" || (
            git commit -m "chore: render the latest CV" &&
            git pull --rebase &&
            git push
          )
