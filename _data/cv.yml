    Projects:
      - name: Systems controlling Klebsiella pneumoniae capsular polysaccharide chain length and attachment 
        summary: Currently investigating the mechanisms and regulatory pathways governing Klebsiella pneumoniae capsule attachment and chain length using various molecular biology and biochemical analytical tools. The ongoing projects aim to unravel the bacterial factors and signaling pathways involved in K. pneumoniae capsular polysaccharide attachment and chain length regulation and their impact on bacterial pathogenesis. 
        highlights:
          - 'Advisor: Dr. Laura A. Mike'
        start_date: 2022
        end_date: 2026

      - name: Susceptibility to Fluoroquinolones and gyrA ser83 mutation in Salmonella enterica Serovar Typhi at a Referral Hospital of Kathmandu Valley
        summary: Conducted a hospital-based study on the prevalence of Salmonella Typhi in febrile patients visiting the Kathmandu Model Hospital and evaluated resistance to fluoroquinolones associated with gyrA ser83 mutation in Salmonella Typhi and Paratyphi isolated from the patients. 
        highlights:
          - 'Advisor: Dr. Megharaj Banjara'
        start_date: 2018
        end_date: 2019

